name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate private-aware statistics
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: node .github/scripts/generate-profile-stats.mjs

      - name: Commit refreshed cards
        run: |
          if git diff --quiet -- assets/profile-stats.svg assets/top-languages.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg assets/top-languages.svg
          git commit -m "chore: refresh profile statistics"
          git push
